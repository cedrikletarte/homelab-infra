services:
  # Cloudflare DDNS: Updates Cloudflare DNS records for VPN access
  cloudflare-ddns:
    container_name: cloudflare-ddns
    image: oznu/cloudflare-ddns:latest
    restart: always
    environment:
      - API_KEY=${API_KEY}
      - ZONE=${ZONE}
      - SUBDOMAIN=${SUBDOMAIN}
      - PROXIED=false
      - TZ=${TZ}

  # Cloudflared: Cloudflare Tunnel to expose local services securely without opening ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - proxy

  # WireGuard: VPN server
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE #optional
    environment:
      - PUID=${WIREGUARD_PUID}
      - PGID=${WIREGUARD_PGID}
      - TZ=${TZ}
      - SERVERURL=auto #optional
      - SERVERPORT=51820 #optional
      - PEERS=1 #optional
      - PEERDNS=auto #optional
      - INTERNAL_SUBNET=${INTERNAL_SUBNET} #optional
      - ALLOWEDIPS=0.0.0.0/0 #optional
      - PERSISTENTKEEPALIVE_PEERS= #optional
      - LOG_CONFS=true #optional
    volumes:
      - wireguard_config:/config
      - wireguard_modules:/lib/modules #optional
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    environment:
      - CF_DNS_API_TOKEN=${API_KEY}
      - TZ=${TZ}
    ports:
      - "80:80"
      - "443:443"
      - "192.168.2.120:8181:8080" # dashboard: LAN IP only, not all interfaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme
      - traefik-logs:/var/log/traefik
    depends_on:
      - crowdsec
    networks:
      - proxy

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/traefik crowdsecurity/base-http-scenarios crowdsecurity/http-cve
      - GID=${CROWDSEC_PGID}
      - TZ=${TZ}
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - ./crowdsec/acquis.d/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml
      - ./crowdsec/acquis.d/traefik.yaml:/etc/crowdsec/acquis.d/traefik.yaml:ro
      - ./crowdsec/acquis.d/ssh.yaml:/etc/crowdsec/acquis.d/ssh.yaml:ro
      - /var/log:/var/log:ro
      - traefik-logs:/traefik-logs:ro
    networks:
      - proxy

volumes:
  wireguard_config:
    name: wireguard_config
    external: true
  wireguard_modules:
    name: wireguard_modules
    external: true
  crowdsec-config:
    name: crowdsec-config
    external: true
  crowdsec-db:
    name: crowdsec-db
    external: true
  traefik-acme:
    name: traefik-acme
    external: true
  traefik-logs:
    name: traefik-logs

networks:
  proxy:
    name: proxy 