- name: Firewall installed
  ansible.builtin.apt:
    name: ufw
    state: present
  tags: [firewall]

- name: Firewall default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }
  tags: [firewall]

- name: Firewall logging
  community.general.ufw:
    logging: "low"
  tags: [firewall]

# Ports published by Docker never reach these rules: Docker's own iptables rules come first.
# Only services listening on the host itself are listed (Plex runs with network_mode: host).
- name: SSH from trusted networks
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item.cidr }}"
    comment: "ssh {{ item.name }}"
  loop: "{{ trusted_networks }}"
  tags: [firewall]

- name: Samba from trusted networks
  community.general.ufw:
    rule: allow
    name: Samba
    from_ip: "{{ item.cidr }}"
  loop: "{{ trusted_networks }}"
  tags: [firewall]

- name: Webmin from trusted networks
  community.general.ufw:
    rule: allow
    port: "10000"
    proto: tcp
    from_ip: "{{ item.cidr }}"
    comment: "webmin {{ item.name }}"
  loop: "{{ trusted_networks }}"
  tags: [firewall]

- name: Plex from anywhere
  community.general.ufw:
    rule: allow
    port: "32400"
    proto: tcp
    comment: Plex Media Server
  tags: [firewall]

# node-exporter runs on the host network and listens on the monitoring network's gateway
# (stacks/monitoring): Prometheus reaches it from that network, nothing else does.
- name: Prometheus can scrape node-exporter
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ security_monitoring_subnet }}"
    to_ip: "{{ security_monitoring_gateway }}"
    port: "9100"
    comment: prometheus to node-exporter
  tags: [firewall]

# Some LAN devices announce themselves to a multicast group every few seconds. Denying them with an
# explicit rule keeps them out of ufw.log: the log rate limit is shared by every blocked packet, so
# this noise could hide a real blocked attempt.
- name: Known LAN broadcasts dropped without logging
  community.general.ufw:
    rule: deny
    direction: in
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from }}"
    to_ip: "{{ item.to }}"
    port: "{{ item.port }}"
    comment: "{{ item.name }}"
  loop: "{{ ufw_silent_drops | default([]) }}"
  tags: [firewall]

- name: Firewall enabled
  community.general.ufw:
    state: enabled
  tags: [firewall]

# The clone holds the .env files and the secret configs (middlewares.yml, http.yaml, wg0.conf): the other
# accounts (media) must not read them. Containers are not affected, Docker resolves bind mounts as root.
- name: Admin home closed to the other accounts
  ansible.builtin.file:
    path: "/home/{{ admin_user }}"
    state: directory
    mode: "0750"
  tags: [secrets]

- name: Find the .env files of the clone
  ansible.builtin.find:
    paths: "{{ repo_dir }}"
    patterns: [".env", ".env.bak-*"]
    hidden: true
    recurse: true
  register: security_env_files
  tags: [secrets]

- name: .env files readable by their owner only
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ security_env_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [secrets]

- name: Deploy command allowed as root for the admin user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/homelab-deploy
    owner: root
    group: root
    mode: "0640"
    content: "{{ admin_user }} ALL=(root) NOPASSWD: {{ security_deploy_command }}\n"
    validate: visudo -cf %s
  tags: [deploy_key]

- name: Deploy key pair
  ansible.builtin.command: ssh-keygen -t ed25519 -N '' -C gitlab-deploy -f {{ security_deploy_key }}
  args:
    creates: "{{ security_deploy_key }}"
  become: true
  become_user: "{{ admin_user }}"
  tags: [deploy_key]

- name: Read the deploy public key
  ansible.builtin.slurp:
    src: "{{ security_deploy_key }}.pub"
  register: security_deploy_pubkey
  tags: [deploy_key]

# A new key (fresh install) must also replace DEPLOY_SSH_KEY in GitLab (see the root README)
- name: Deploy key restricted to the deploy command
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ security_deploy_pubkey.content | b64decode }}"
    key_options: 'restrict,command="sudo -n {{ security_deploy_command }}"'
  tags: [deploy_key]
