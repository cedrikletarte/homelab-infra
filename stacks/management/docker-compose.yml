name : management
services:
  # Vaultwarden: Self-hosted password manager compatible with Bitwarden clients
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:1.37.4
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - vaultwarden:/data/
    environment:
      - LOG_FILE=/data/vaultwarden.log
      - LOG_LEVEL=warn  # Or 'info' for more detailed logs
      - IP_HEADER=CF-Connecting-IP # real client IP, always overwritten by Cloudflare (X-Forwarded-For is client-controllable)
      - IP_HEADER_TRUSTED_PROXIES=172.19.0.0/16 # only trust that header when it comes from the proxy network
      # - ADMIN_TOKEN=${ADMIN_TOKEN} # activate/deactivate the admin web page
      - SIGNUPS_ALLOWED=false # disable user registration
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${PRIMARY_DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.middlewares=crowdsec@file"

  # Homarr: Dashboard for managing and monitoring services
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:v2.4.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - homarr_appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '${LAN_IP:?set LAN_IP in .env}:7575:7575'
    restart: always
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}

  # Portainer: Docker management UI
  portainer:
    image: portainer/portainer-ce:2.45.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    container_name: portainer
    environment:
      - TZ=${TZ}
    volumes:
      - portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:9000:9000"
    restart: always

  # n8n: Workflow automation tool
  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:2.43.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:5678:5678"
      - 127.0.0.1:5678:5678
    environment:
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - NODES_EXCLUDE=[]
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DATABASE}
      - DB_POSTGRESDB_HOST=${POSTGRES_HOST}
      - DB_POSTGRESDB_PORT=${POSTGRES_PORT}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_SCHEMA=${POSTGRES_SCHEMA}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - db_network


volumes:
  homarr_appdata:
    name: homarr_appdata
    external: true
  n8n_data:
    name: n8n_data
    external: true
  vaultwarden:
    name: vaultwarden
    external: true
  portainer:
    name: portainer
    external: true

networks:
  proxy:
    external: true
  db_network:
    external: true