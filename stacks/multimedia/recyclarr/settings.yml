# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/settings-schema.json

# Homemade custom formats, in addition to the TRaSH Guides ones
resource_providers:
  - name: homelab-radarr
    type: custom-formats
    service: radarr
    path: /config/custom-formats/radarr
  - name: homelab-sonarr
    type: custom-formats
    service: sonarr
    path: /config/custom-formats/sonarr
