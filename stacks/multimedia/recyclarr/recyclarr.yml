        score: 50
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      # Rejected (TRaSH score -10000: below the minimum score of every profile, whatever the bonuses)
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback): no HDR10 layer, Plex would have to transcode
          - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
          - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
          - 3ba797e5dc13af4b8d9bb25e83d90de2  # FR LQ
          - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
          - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
        assign_scores_to:
