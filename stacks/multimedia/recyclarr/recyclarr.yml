# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Custom formats and their scores in the Radarr/Sonarr quality profiles.
# Recyclarr owns everything listed here: an edit made in the Radarr/Sonarr UI to one of these
# custom formats or scores is overwritten at the next sync (daily). Edit this file instead.
#
# The profiles are referenced by name only, so their qualities, cutoff and upgrade settings stay
# as set in the UI: the quality always wins, the custom format score only breaks ties.
#
# French and English audio are required: HD-1080p and Ultra-HD have a minimum score of 5000, which
# only MULTI FR+EN reaches (all the other bonuses add up to 1150). Their "VO" twin, same qualities,
# accepts any language (minimum 0): vo-approval moves an item there once allowed on Discord.
#
# Homemade custom formats (MULTI, HDR10, x265) live in custom-formats/, the others come from
# TRaSH Guides (https://trash-guides.info). Their trash_id is in the file name of
# https://github.com/TRaSH-Guides/Guides/tree/master/docs/json/radarr/cf (or sonarr/cf).

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_profiles:
      - name: HD-1080p
        min_format_score: 5000
        reset_unmatched_scores:
          enabled: true
      - name: Ultra-HD
        min_format_score: 5000
        reset_unmatched_scores:
          enabled: true
      - name: HD-1080p VO
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true
      - name: Ultra-HD VO
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # French + English audio: required by HD-1080p and Ultra-HD (minimum score 5000)
      - trash_ids:
          - a39b4e06388f17fe8171747f765c660f  # MULTI FR+EN
        score: 5000
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      # MULTi/VFF/TRUEFRENCH in the title: a tie-breaker
      - trash_ids:
          - 6ec9b031bbb4eb404d3957a2fed107e3  # MULTI KEYWORDS
        score: 1000
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      - trash_ids:
          - de8a8d56b70895173512825933812ad9  # x265 - HEVC
        score: 100
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      - trash_ids:
          - ec1aec5babea11afa1ca3c014a0c87ea  # HDR10
        score: 50
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      # Rejected (TRaSH score -10000: below the minimum score of every profile, whatever the bonuses)
      - trash_ids:
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback): no HDR10 layer, Plex would have to transcode
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - 48f031e76111f17ea94898f4cdc34fdc  # FR LQ
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

