    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_profiles:
      - name: HD-1080p
        min_format_score: 5000
        reset_unmatched_scores:
          enabled: true
      - name: Ultra-HD
        min_format_score: 5000
        reset_unmatched_scores:
          enabled: true
      - name: HD-1080p VO
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true
      - name: Ultra-HD VO
        min_format_score: 0
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # French + English audio: required by HD-1080p and Ultra-HD (minimum score 5000)
      - trash_ids:
          - 5bebaf68a1dfe7b77133bb6342243371  # MULTI FR+EN
        score: 5000
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      # MULTi/VFF/TRUEFRENCH in the title: a tie-breaker
      - trash_ids:
          - 2e6614d5b89015d954eea11a18f9b90d  # MULTI KEYWORDS
        score: 1000
        assign_scores_to:
          - name: HD-1080p
          - name: Ultra-HD
          - name: HD-1080p VO
          - name: Ultra-HD VO

      - trash_ids:
          - 3144bb62ab74d72b4124594cc1b00cec  # x265 - HEVC
        score: 100
        assign_scores_to:
