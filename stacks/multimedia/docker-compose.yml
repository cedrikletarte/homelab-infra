name: multimedia
services:
  # Plex: Media server software
  plex:
    image: plexinc/pms-docker:1.43.4.10903-e5521bd8c
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    container_name: plex
    environment:
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
      - PLEX_UID=${PLEX_UID}
      - PLEX_GID=${PLEX_GID}
    volumes:
      - plex_database:/config
      - plex_transcode:/transcode
      - ${MEDIA_PATH}:/data
    restart: always
    network_mode: host

  # Seerr: Media request management and discovery tool
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    volumes:
      - seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${PRIMARY_DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.routers.seerr.tls.certresolver=letsencrypt"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.http.routers.seerr.middlewares=crowdsec@file"

  # Flaresolverr: Proxy server to bypass Cloudflare protection
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    volumes:
      - flaresolverr:/config
    restart: unless-stopped
    networks:
      - internal

  # Gluetun: VPN client container to route traffic through a VPN
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:2733bb22b27e3efa7a9f2cef9057ec12791b8b225793fcd3dbfd0508404dfc25
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      ## OPENVPN CONFIG ##
      #- LOG_LEVEL=info
      #- VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      #- OPENVPN_USER=${OPENVPN_USER}
      #- OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      #- OPENVPN_PROTOCOL=${OPENVPN_PROTOCOL}
      #- SERVER_REGIONS=${SERVER_REGIONS}
      #- VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      #- PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET=${PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET}
      #- VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /gluetun/scripts/portforward-up.sh {{PORT}} {{VPN_INTERFACE}}
      #- VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh /gluetun/scripts/portforward-down.sh

      ## WIREGUARD CONFIG ##
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - SERVER_NAMES=${SERVER_NAMES} # Check gluetun logs, it will tell you the server name to use for your region based on the wg0.conf file you provide
      - WIREGUARD_CONFIG_FILE=/gluetun/wireguard/wg0.conf
      - LOG_LEVEL=info
      # Port forwarding PIA
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=private internet access
      - VPN_PORT_FORWARDING_USERNAME=${OPENVPN_USER}
      - VPN_PORT_FORWARDING_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /gluetun/scripts/portforward-up.sh {{PORT}} {{VPN_INTERFACE}}
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh /gluetun/scripts/portforward-down.sh
    volumes:
      - gluetun:/gluetun
      - ./gluetun/scripts/portforward-up.sh:/gluetun/scripts/portforward-up.sh
      - ./gluetun/scripts/portforward-down.sh:/gluetun/scripts/portforward-down.sh
      - ./gluetun/wg0.conf:/gluetun/wireguard/wg0.conf
    ports:
      - 8080:8080
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # qBittorrent: BitTorrent client
  qbittorrent:
    image: linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    container_name: qbittorrent
    environment:
      - PUID=${MULTIMEDIA_UID}
      - PGID=${MULTIMEDIA_GID}
      - UMASK=002
      - WEBUI_PORT=8080
      - TZ=${TZ}
    volumes:
      - qbittorrent:/config
      - ${MEDIA_PATH}:/data
    network_mode: service:gluetun
    ports: []
    restart: always
    depends_on:
          gluetun:
            condition: service_healthy

  # Radarr: Movie collection manager
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    container_name: radarr
    environment:
      - PUID=${MULTIMEDIA_UID}
      - PGID=${MULTIMEDIA_GID}
      - TZ=${TZ}
      - UMASK=002
    ports:
      - "7878:7878"
    volumes:
      - ${MEDIA_PATH}:/data
      - radarr:/config
    restart: always
    networks:
      - internal


  # Sonarr: TV series collection manager
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    container_name: sonarr
    environment:
      - PUID=${MULTIMEDIA_UID}
      - PGID=${MULTIMEDIA_GID}
      - TZ=${TZ}
      - UMASK=002
    ports:
      - "8989:8989"
    volumes:
      - ${MEDIA_PATH}:/data
      - sonarr:/config
    restart: always
    networks:
      - internal

  # Lidarr: Music collection manager
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls43
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    container_name: lidarr
    environment:
      - PUID=${MULTIMEDIA_UID}
      - PGID=${MULTIMEDIA_GID}
      - TZ=${TZ}
      - UMASK=002
    ports:
      - "8686:8686"
    volumes:
      - ${MEDIA_PATH}:/data
      - lidarr:/config
    restart: always
    networks:
      - internal

  # Prowlarr: Indexer manager/proxy for Sonarr, Radarr, and other applications
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    container_name: prowlarr
    environment:
      - PUID=${MULTIMEDIA_UID}
      - PGID=${MULTIMEDIA_GID}
      - TZ=${TZ}
    ports:
      - "9696:9696"
    volumes:
      - prowlarr:/config
    restart: always
    networks:
      - internal

  # Recyclarr: Syncs custom formats and their scores to Radarr and Sonarr (daily)
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    container_name: recyclarr
    environment:
      - TZ=${TZ}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      - recyclarr:/config
      - ./recyclarr/recyclarr.yml:/config/recyclarr.yml:ro
      - ./recyclarr/settings.yml:/config/settings.yml:ro
      - ./recyclarr/custom-formats:/config/custom-formats:ro
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - radarr
      - sonarr


volumes:
  gluetun:
    name: gluetun
    external: true
  seerr:
    name: seerr
    external: true
  plex_transcode:
    name: plex_transcode
    external: true
  plex_database:
    name: plex_database
    external: true
  prowlarr:
    name: prowlarr
    external: true
  qbittorrent:
    name: qbittorrent
    external: true
  radarr:
    name: radarr
    external: true
  sonarr:
    name: sonarr
    external: true
  lidarr:
    name: lidarr
    external: true
  flaresolverr:
    name: flaresolverr
    external: true
  recyclarr:
    name: recyclarr
    external: true

networks:
  proxy:
    external: true
  internal:
    name: media_internal