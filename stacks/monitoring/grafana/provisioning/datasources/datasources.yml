apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s

  # The table the maintenance scripts, CrowdSec and GitLab report to (through n8n).
  # Read-only account: SELECT on that table only.
  - name: homelab_alerts
    uid: homelab-alerts
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader
    jsonData:
      database: n8n
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $HOMELAB_ALERTS_READER_PASSWORD
