name: nextcloud

services:
  # Nextcloud AIO mastercontainer: spawns and manages the actual Nextcloud containers
  # (apache, db, redis, etc.) via the Docker socket. Runs in reverse-proxy mode: the
  # spawned "nextcloud-aio-apache" container joins the "proxy" network and is routed
  # to by Traefik's file provider (see infrastructure/network/traefik/dynamic/nextcloud.yml),
  # since Traefik can't attach docker labels to a container it didn't create itself.
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    environment:
      - APACHE_PORT=11000
      # Host port of the apache container on loopback only: Traefik reaches it through the proxy network,
      # and a port open on the LAN would serve Nextcloud in plain HTTP without the CrowdSec middleware
      - APACHE_IP_BINDING=127.0.0.1
      - APACHE_ADDITIONAL_NETWORK=proxy
      - SKIP_DOMAIN_VALIDATION=true
      - NEXTCLOUD_DATADIR=${NEXTCLOUD_DATADIR}
    ports:
      # AIO admin/setup interface (self-signed cert) - kept off Traefik on purpose,
      # host port 8080 is already taken by qBittorrent so it's remapped to 18080.
      - "${LAN_IP:?set LAN_IP in .env}:18080:8080"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
